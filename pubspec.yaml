name: splitly
description: "Money Pockets - Give every rupee a job."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.2

  # UI helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.15
  lottie: ^3.2.0
  animations: ^2.0.11

  # Charts
  fl_chart: ^0.69.2

  # Auth & security
  local_auth: ^2.3.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utilities
  uuid: ^4.5.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true